<!DOCTYPE html>
<html>
<head>
    <title>设置根目录 - 文件服务器</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/jasmine_base.css">
    <style>
        body {
            font-family: "Source Han Sans CN", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--jasmine-gradient-main);
            margin: 0;
            padding: 20px;
        }
        .settings-card {
            background: var(--jasmine-panel-gradient);
            padding: 44px 40px;
            border-radius: 20px;
            box-shadow: var(--jasmine-shadow-lg);
            text-align: center;
            width: 100%;
            max-width: 520px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border: 1px solid rgba(95, 191, 174, 0.18);
            backdrop-filter: blur(8px);
        }
        .settings-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 48px rgba(30, 114, 96, 0.22);
        }
        .settings-icon {
            font-size: 50px;
            color: var(--jasmine-green-600);
            margin-bottom: 18px;
        }
        h1 {
            color: var(--jasmine-green-700);
            margin-bottom: 18px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-label {
            font-weight: 600;
            color: var(--jasmine-muted);
            margin-bottom: 6px;
        }
        .form-control {
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 16px;
        }
        .btn-primary {
            padding: 13px 25px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.25s;
            width: 100%;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .btn-outline-secondary {
            border-radius: 14px;
            padding: 13px 25px;
            font-size: 16px;
            transition: all 0.25s;
            width: 100%;
            margin-top: 10px;
        }
        .btn-outline-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 114, 96, 0.18);
        }
        .alert {
            margin-top: 20px;
            border-radius: 8px;
            padding: 12px;
        }
        .alert-danger {
            background-color: rgba(240, 124, 130, 0.12);
            border-color: rgba(240, 124, 130, 0.28);
            color: #b3393f;
        }
        .current-root {
            background: linear-gradient(135deg, rgba(214, 242, 234, 0.88), rgba(244, 249, 244, 0.95));
            border-radius: 16px;
            padding: 18px;
            margin: 20px 0;
            border-left: 4px solid var(--jasmine-green-500);
            text-align: left;
            box-shadow: 0 6px 18px rgba(30, 114, 96, 0.15);
        }
        .current-root strong {
            color: var(--jasmine-green-700);
        }
        .current-root-path {
            display: block;
            word-break: break-all;
            font-family: monospace;
            background-color: rgba(244, 249, 244, 0.9);
            padding: 10px;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 14px;
            border: 1px solid rgba(95, 191, 174, 0.22);
        }
        .hint {
            margin-top: 20px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(200, 236, 224, 0.75), rgba(233, 247, 242, 0.9));
            border-radius: 14px;
            font-size: 14px;
            color: var(--jasmine-green-700);
            text-align: left;
            border-left: 4px solid var(--jasmine-green-500);
            box-shadow: 0 6px 14px rgba(54, 170, 151, 0.15);
        }
        .hint i {
            margin-right: 5px;
        }
        @media (max-width: 576px) {
            .settings-card {
                padding: 30px 20px;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="settings-card">
        <div class="settings-icon">
            <i class="fas fa-folder"></i>
        </div>
        <h1>设置共享文件夹</h1>
        
        {% if current_root %}
            <div class="current-root">
                <strong><i class="fas fa-info-circle"></i> 当前共享目录:</strong>
                <span class="current-root-path">{{ current_root }}</span>
            </div>
        {% endif %}
        
        <form method="post">
            <div class="form-group">
                <label for="root_path" class="form-label">共享路径</label>
                <input type="text" class="form-control" id="root_path" name="root_path" placeholder="请输入要共享的文件夹路径" value="{{ current_root or '' }}" required>
            </div>
            <div class="form-group">
                <label for="admin_password" class="form-label" style="color: #e74c3c;">
                    <i class="fas fa-lock"></i> 管理员密码
                </label>
                <input type="password" class="form-control" id="admin_password" name="admin_password" placeholder="修改目录需要管理员密码" required style="border-color: #e74c3c;">
                <small class="text-muted" style="display: block; margin-top: 5px;">
                    ⚠️ 此操作需要管理员密码验证
                </small>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-check-circle mr-2"></i>设置并进入
            </button>
        </form>
        
        {% if error %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
            </div>
        {% endif %}
        
        <div class="hint">
            <i class="fas fa-lightbulb"></i> 路径示例:
            <ul>
                <li>Windows: C:\MyFiles 或 C:/MyFiles</li>
                <li>Linux/Mac: /home/user/documents</li>
            </ul>
        </div>
    </div>
    
    <script src="/static/js/jquery-3.6.0.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
