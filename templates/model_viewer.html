<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D模型查看器 - {{ filename }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
        <!-- Theme System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--jasmine-green-600) 0%, var(--jasmine-green-400) 100%);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #toolbar {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            color: white;
            min-width: 200px;
        }

        #toolbar h5 {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #67c23a;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        .toolbar-btn {
            display: block;
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
        }

        .toolbar-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }

        .toolbar-btn i {
            margin-right: 8px;
            width: 16px;
            display: inline-block;
        }

        #info-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-size: 13px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        #info-panel h4 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #409EFF;
        }

        #info-panel p {
            margin: 5px 0;
            line-height: 1.6;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 50px;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            z-index: 2000;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #67c23a;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            z-index: 1000;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            transform: translateY(-2px);
        }

        .back-btn i {
            margin-right: 8px;
        }

        #error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            z-index: 2000;
            display: none;
            max-width: 500px;
            text-align: center;
        }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('site_theme') || 'jasmine';
            document.body.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <!-- 返回按钮 -->
    <a href="{{ back_url }}" class="back-btn">
        <i class="fas fa-arrow-left"></i>返回文件列表
    </a>

    <!-- 3D画布容器 -->
    <div id="canvas-container"></div>

    <!-- 工具栏 -->
    <div id="toolbar">
        <h5><i class="fas fa-tools"></i> 控制工具</h5>
        <button class="toolbar-btn" onclick="resetCamera()">
            <i class="fas fa-redo"></i>重置视角
        </button>
        <button class="toolbar-btn" onclick="toggleWireframe()">
            <i class="fas fa-border-all"></i>线框模式
        </button>
        <button class="toolbar-btn" onclick="toggleGrid()">
            <i class="fas fa-th"></i>显示网格
        </button>
        <button class="toolbar-btn" onclick="toggleAxes()">
            <i class="fas fa-arrows-alt"></i>显示坐标轴
        </button>
        <button class="toolbar-btn" onclick="changeBackground()">
            <i class="fas fa-palette"></i>切换背景
        </button>
        <button class="toolbar-btn" onclick="toggleAutoRotate()">
            <i class="fas fa-sync-alt"></i>自动旋转
        </button>
    </div>

    <!-- 信息面板 -->
    <div id="info-panel">
        <h4><i class="fas fa-cube"></i> {{ filename }}</h4>
        <p><strong>格式:</strong> {{ file_ext.upper() }}</p>
        <p><strong>操作:</strong> 鼠标左键旋转 | 右键平移 | 滚轮缩放</p>
        <p id="model-stats">加载中...</p>
    </div>

    <!-- 加载提示 -->
    <div id="loading">
        <div class="spinner"></div>
        <div>正在加载3D模型...</div>
    </div>

    <!-- 错误提示 -->
    <div id="error-message"></div>

    <!-- Three.js ES6模块 -->
    <script type="importmap">
    {
        "imports": {
            "three": "{{ url_for('static', filename='libs/three/three.module.js') }}",
            "three/addons/": "{{ url_for('static', filename='libs/three/') }}"
        }
    }
    </script>
    
    <script type="module">
        // 导入Three.js核心和加载器
        import * as THREE from 'three';
        import { GLTFLoader } from '{{ url_for('static', filename='libs/three/GLTFLoader.js') }}';
        import { OBJLoader } from '{{ url_for('static', filename='libs/three/OBJLoader.js') }}';
        import { STLLoader } from '{{ url_for('static', filename='libs/three/STLLoader.js') }}';
        import { OrbitControls } from '{{ url_for('static', filename='libs/three/OrbitControls.js') }}';

        // 全局变量
        let scene, camera, renderer, controls;
        let model, wireframeHelper, gridHelper, axesHelper;
        let isWireframe = false;
        let autoRotate = false;
        let currentBgIndex = 0;
        const backgrounds = [
            { color: 0x1a1a2e, name: '深蓝' },
            { color: 0x2d3436, name: '深灰' },
            { color: 0xffffff, name: '白色' },
            { color: 0x000000, name: '黑色' },
            { color: 0x16213e, name: '午夜蓝' }
        ];

        // 初始化场景
        function init() {
            const container = document.getElementById('canvas-container');

            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(backgrounds[currentBgIndex].color);

            // 创建相机
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(5, 5, 5);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 添加灯光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.5);
            pointLight.position.set(-10, -10, -5);
            scene.add(pointLight);

            // 添加控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 1;
            controls.maxDistance = 100;

            // 添加网格辅助
            gridHelper = new THREE.GridHelper(20, 20, 0x888888, 0x444444);
            gridHelper.visible = false;
            scene.add(gridHelper);

            // 添加坐标轴辅助
            axesHelper = new THREE.AxesHelper(5);
            axesHelper.visible = false;
            scene.add(axesHelper);

            // 窗口大小调整
            window.addEventListener('resize', onWindowResize, false);

            // 加载模型
            loadModel();

            // 开始渲染循环
            animate();
        }

        // 加载模型
        function loadModel() {
            const modelUrl = '{{ model_url }}';
            const fileExt = '{{ file_ext }}'.toLowerCase();

            let loader;
            if (fileExt === '.gltf' || fileExt === '.glb') {
                loader = new GLTFLoader();
                loader.load(
                    modelUrl,
                    (gltf) => {
                        model = gltf.scene;
                        onModelLoaded(model);
                    },
                    onProgress,
                    onError
                );
            } else if (fileExt === '.obj') {
                loader = new OBJLoader();
                loader.load(
                    modelUrl,
                    (obj) => {
                        model = obj;
                        onModelLoaded(model);
                    },
                    onProgress,
                    onError
                );
            } else if (fileExt === '.stl') {
                loader = new STLLoader();
                loader.load(
                    modelUrl,
                    (geometry) => {
                        const material = new THREE.MeshPhongMaterial({
                            color: 0x67c23a,
                            specular: 0x111111,
                            shininess: 200
                        });
                        model = new THREE.Mesh(geometry, material);
                        onModelLoaded(model);
                    },
                    onProgress,
                    onError
                );
            } else if (fileExt === '.step' || fileExt === '.stp') {
                // STEP 文件是 CAD 格式，Three.js 不直接支持
                // 显示友好的提示信息
                document.getElementById('loading').style.display = 'none';
                showError(
                    'STEP 文件格式暂不支持直接预览。<br><br>' +
                    '<strong>建议解决方案：</strong><br>' +
                    '1. 使用 CAD 软件（如 FreeCAD、Blender）将 STEP 文件转换为 STL 或 OBJ 格式<br>' +
                    '2. 或使用在线转换工具进行格式转换<br><br>' +
                    '<small>当前支持的格式：GLTF/GLB、OBJ、STL、FBX</small>'
                );
            } else {
                showError('不支持的文件格式: ' + fileExt);
            }
        }

        // 模型加载完成
        function onModelLoaded(loadedModel) {
            scene.add(loadedModel);

            // 计算模型包围盒并居中
            const box = new THREE.Box3().setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            // 将模型移到原点
            loadedModel.position.sub(center);

            // 调整相机位置以适应模型
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= 1.5; // 留一些空间
            camera.position.set(cameraZ, cameraZ, cameraZ);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);
            controls.update();

            // 更新统计信息
            updateStats(loadedModel, size);

            // 隐藏加载提示
            document.getElementById('loading').style.display = 'none';
        }

        // 加载进度
        function onProgress(xhr) {
            if (xhr.lengthComputable) {
                const percentComplete = (xhr.loaded / xhr.total * 100).toFixed(0);
                document.getElementById('loading').innerHTML = `
                    <div class="spinner"></div>
                    <div>加载中 ${percentComplete}%</div>
                `;
            }
        }

        // 加载错误
        function onError(error) {
            console.error('加载模型失败:', error);
            showError('加载模型失败: ' + error.message);
        }

        // 显示错误
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorDiv = document.getElementById('error-message');
            errorDiv.innerHTML = `
                <i class="fas fa-exclamation-triangle" style="font-size: 32px; margin-bottom: 10px;"></i><br>
                ${message}
            `;
            errorDiv.style.display = 'block';
        }

        // 更新统计信息
        function updateStats(model, size) {
            let triangles = 0;
            model.traverse((child) => {
                if (child.isMesh) {
                    const geometry = child.geometry;
                    if (geometry.index !== null) {
                        triangles += geometry.index.count / 3;
                    } else {
                        triangles += geometry.attributes.position.count / 3;
                    }
                }
            });

            document.getElementById('model-stats').innerHTML = `
                <strong>顶点数:</strong> ${Math.floor(triangles * 3).toLocaleString()}<br>
                <strong>三角形:</strong> ${Math.floor(triangles).toLocaleString()}<br>
                <strong>尺寸:</strong> ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}
            `;
        }

        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotate && model) {
                model.rotation.y += 0.01;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // 全局函数 - 重置相机
        window.resetCamera = function() {
            if (model) {
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                cameraZ *= 1.5;
                camera.position.set(cameraZ, cameraZ, cameraZ);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        };

        // 切换线框模式
        window.toggleWireframe = function() {
            if (!model) return;
            isWireframe = !isWireframe;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.material.wireframe = isWireframe;
                }
            });
        };

        // 切换网格
        window.toggleGrid = function() {
            gridHelper.visible = !gridHelper.visible;
        };

        // 切换坐标轴
        window.toggleAxes = function() {
            axesHelper.visible = !axesHelper.visible;
        };

        // 切换背景
        window.changeBackground = function() {
            currentBgIndex = (currentBgIndex + 1) % backgrounds.length;
            scene.background = new THREE.Color(backgrounds[currentBgIndex].color);
        };

        // 切换自动旋转
        window.toggleAutoRotate = function() {
            autoRotate = !autoRotate;
        };

        // 初始化
        init();
    </script>
<script src="{{ url_for('static', filename='js/theme_floater.js') }}"></script>
</body>
</html>
