<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预览 - {{ filename }}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/github-markdown-light.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/jasmine_base.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--jasmine-gradient-main);
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            color: var(--jasmine-ink);
        }
        /* 顶部工具栏 */
        .preview-header {
            background: linear-gradient(135deg, var(--jasmine-green-600) 0%, var(--jasmine-green-400) 100%);
            color: white;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
            min-height: 60px;
        }
        .preview-header .title-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        .preview-header .title-section i {
            font-size: 1.8rem;
            flex-shrink: 0;
        }
        .preview-header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preview-header .buttons {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .preview-header .btn {
            padding: 8px 18px;
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: transparent;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .preview-header .btn:hover {
            background: white;
            color: var(--jasmine-green-600);
            border-color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .preview-header .btn i {
            margin-right: 6px;
        }
        /* Markdown容器 */
        .markdown-container {
            max-width: 920px;
            margin: 30px auto;
            background: white;
            padding: 50px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .markdown-body {
            font-size: 1rem;
            line-height: 1.8;
            color: #2c3e50;
        }
        .markdown-body h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e9ecef;
        }
        .markdown-body h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        .markdown-body h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
        }
        .markdown-body p {
            margin-bottom: 1rem;
        }
        /* 响应式设计 */
        @media (max-width: 768px) {
            .markdown-container {
                margin: 20px;
                padding: 30px 25px;
            }
            .preview-header {
                padding: 10px 15px;
            }
            .preview-header h1 {
                font-size: 1rem;
            }
            .preview-header .btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="preview-header">
        <div class="title-section">
            <i class="fas fa-file-alt"></i>
            <h1 title="{{ filename }}">{{ filename }}</h1>
        </div>
        <div class="buttons">
            <a href="{{ url_for('share_download', share_code=share_code) }}" class="btn">
                <i class="fas fa-download"></i> 下载
            </a>
            <a href="{{ url_for('share_view', share_code=share_code) }}" class="btn">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
        </div>
    </div>
    
    <div class="markdown-container">
        <article class="markdown-body">
            {{ content|safe }}
        </article>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
