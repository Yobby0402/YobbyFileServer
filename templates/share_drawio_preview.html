<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预览 - {{ filename }}</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/jasmine_base.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            background: var(--jasmine-gradient-main);
        }
        /* 顶部工具栏 */
        .preview-header {
            background: linear-gradient(135deg, rgba(13, 116, 100, 0.92), rgba(54, 170, 151, 0.92));
            color: #fdfdf8;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 14px 30px rgba(13, 116, 100, 0.28);
            flex-shrink: 0;
            min-height: 60px;
        }
        .preview-header .title-section {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        .preview-header .title-section i {
            font-size: 1.8rem;
            flex-shrink: 0;
        }
        .preview-header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preview-header .buttons {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .preview-header .btn {
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.14);
            color: #fdfdf8;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
            white-space: nowrap;
        }
        .preview-header .btn:hover {
            background: #fdfdf8;
            color: var(--jasmine-green-600);
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(30, 114, 96, 0.25);
        }
        .preview-header .btn i {
            margin-right: 6px;
        }
        /* 提示横幅 */
        .info-banner {
            background: linear-gradient(135deg, rgba(214, 242, 234, 0.85), rgba(244, 249, 244, 0.9));
            color: var(--jasmine-green-700);
            padding: 12px 25px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            border-bottom: 1px solid rgba(95, 191, 174, 0.18);
            flex-shrink: 0;
        }
        .info-banner i {
            margin-right: 8px;
            font-size: 1.1rem;
        }
        /* Draw.io容器 */
        .drawio-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.85);
            position: relative;
            overflow: hidden;
        }
        .drawio-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* 响应式设计 */
        @media (max-width: 768px) {
            .preview-header {
                padding: 10px 15px;
            }
            .preview-header h1 {
                font-size: 1rem;
            }
            .preview-header .btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            .info-banner {
                font-size: 0.85rem;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="preview-header">
        <div class="title-section">
            <i class="fas fa-project-diagram"></i>
            <h1 title="{{ filename }}">{{ filename }}</h1>
        </div>
        <div class="buttons">
            <a href="{{ url_for('share_download', share_code=share_code) }}" class="btn">
                <i class="fas fa-download"></i> 下载
            </a>
            <a href="{{ url_for('share_view', share_code=share_code) }}" class="btn">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
        </div>
    </div>
    
    <div class="info-banner">
        <i class="fas fa-info-circle"></i> 
        只读预览模式 - 可查看图表但无法编辑
    </div>
    
    <div class="drawio-container">
        <iframe src="/drawio_embed?filepath={{ file_path }}&readonly=1" allowfullscreen></iframe>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
