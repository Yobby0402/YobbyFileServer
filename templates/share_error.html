<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问失败</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/jasmine_base.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, var(--jasmine-green-600) 0%, var(--jasmine-green-400) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
        }
        .error-container {
            background: var(--jasmine-panel-gradient);
            border-radius: 20px;
            box-shadow: var(--jasmine-shadow-lg);
            padding: 45px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(95, 191, 174, 0.18);
            backdrop-filter: blur(6px);
        }
        .error-icon {
            font-size: 5rem;
            color: #dc3545;
            margin-bottom: 25px;
            display: block;
        }
        .error-container h1 {
            color: #2c3e50;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .error-message {
            color: #495057;
            font-size: 1.05rem;
            font-weight: 500;
            margin-bottom: 35px;
            padding: 22px 25px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%);
            border-radius: 10px;
            border-left: 4px solid #dc3545;
        }
        .error-message i {
            margin-right: 8px;
            color: #dc3545;
        }
        .error-container > p {
            color: #6c757d;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .error-container ul {
            text-align: left;
            list-style: none;
            padding: 0;
        }
        .error-container ul li {
            color: #6c757d;
            font-size: 0.95rem;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid var(--jasmine-green-600);
        }
        .error-container ul li::before {
            content: "•";
            color: var(--jasmine-green-600);
            font-weight: bold;
            margin-right: 10px;
        }
        /* 响应式 */
        @media (max-width: 576px) {
            .error-container {
                padding: 35px 25px;
            }
            .error-container h1 {
                font-size: 1.5rem;
            }
            .error-icon {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1><i class="fas fa-times-circle"></i> 无法访问</h1>
        <div class="error-message">
            <i class="fas fa-info-circle"></i> {{ error }}
        </div>
        <p class="text-muted">
            可能的原因：
        </p>
        <ul class="text-start text-muted">
            <li>分享链接已过期</li>
            <li>分享链接已被删除</li>
            <li>访问次数已达上限</li>
            <li>链接地址不正确</li>
        </ul>
        <div class="text-center mt-4">
            <p class="text-muted small">
                <i class="fas fa-info-circle"></i> 
                如有问题，请联系分享者
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
