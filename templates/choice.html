<!DOCTYPE html>
<html lang="zh-CN">

<head>
    {% include '_theme_bootstrap.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yobboy Server 工作区入口">
    <title>Yobboy Server · 工作区</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/choice.css') }}">
</head>

<body>
    <div class="choice-page">
        <header class="choice-header">
            <button class="brand" type="button" aria-label="Yobboy Server 工作区">
                <span class="brand-mark" aria-hidden="true">Y</span>
                <span class="brand-copy">
                    <span class="brand-eyebrow">Yobboy Server</span>
                    <span class="brand-title">工作区入口</span>
                </span>
            </button>

            <nav class="header-actions" aria-label="页面操作">
                <div class="theme-control">
                    <button class="header-button" id="themeButton" type="button" aria-expanded="false" aria-controls="themeMenu">
                        <i class="fa fa-paint-brush" aria-hidden="true"></i>
                        <span>主题</span>
                        <i class="fa fa-angle-down" aria-hidden="true"></i>
                    </button>
                    <div class="theme-menu" id="themeMenu" hidden>
                        <div class="theme-menu-title">颜色主题</div>
                        <button type="button" data-theme-color="jasmine">茉莉奶白</button>
                        <button type="button" data-theme-color="ocean">海洋蓝</button>
                        <button type="button" data-theme-color="forest">雾林灰绿</button>
                        <button type="button" data-theme-color="sunset">暖砂橙</button>
                        <button type="button" data-theme-color="lavender">雾紫灰</button>
                        <button type="button" data-theme-color="graphite">深海石墨</button>
                        <div class="theme-menu-divider" role="separator"></div>
                        <div class="theme-menu-title">表面样式</div>
                        <button type="button" data-morph="flat">纯色模式</button>
                        <button type="button" data-morph="glassmorphism">玻璃拟态</button>
                        <button type="button" data-morph="claymorphism">粘土拟态</button>
                    </div>
                </div>
                <a class="header-button" href="/help">
                    <i class="fa fa-question-circle" aria-hidden="true"></i>
                    <span>帮助</span>
                </a>
                <a class="header-button header-button-muted" href="/logout">
                    <i class="fa fa-sign-out" aria-hidden="true"></i>
                    <span>退出</span>
                </a>
            </nav>
        </header>

        <main class="choice-main">
            <section class="intro" aria-labelledby="page-title">
                <p class="intro-kicker">WORKSPACE / 入口选择</p>
                <h1 id="page-title">选择一个工作区</h1>
                <p>从这里进入你的文件、任务、设计和设备工具。</p>
            </section>

            <section class="tool-grid" aria-label="工作区列表">
                <a class="tool-card" href="/file_browser">
                    <span class="tool-card-icon" aria-hidden="true"><i class="fas fa-folder-open"></i></span>
                    <span class="tool-card-body">
                        <span class="tool-card-title">文件浏览器</span>
                        <span class="tool-card-description">浏览、检索与共享本地文件。</span>
                    </span>
                    <span class="tool-card-arrow" aria-hidden="true"><i class="fas fa-arrow-up-right-from-square"></i></span>
                </a>

                <a class="tool-card" href="/todo/v2">
                    <span class="tool-card-icon" aria-hidden="true"><i class="fas fa-tasks"></i></span>
                    <span class="tool-card-body">
                        <span class="tool-card-title">ToDo 任务管理</span>
                        <span class="tool-card-description">规划、跟踪和推进当前任务。</span>
                    </span>
                    <span class="tool-card-arrow" aria-hidden="true"><i class="fas fa-arrow-up-right-from-square"></i></span>
                </a>

                <a class="tool-card" href="/product_compare">
                    <span class="tool-card-icon" aria-hidden="true"><i class="fas fa-balance-scale"></i></span>
                    <span class="tool-card-body">
                        <span class="tool-card-title">产品对比</span>
                        <span class="tool-card-description">整理参数并快速比较产品。</span>
                    </span>
                    <span class="tool-card-arrow" aria-hidden="true"><i class="fas fa-arrow-up-right-from-square"></i></span>
                </a>

                <a class="tool-card" href="/erp">
                    <span class="tool-card-icon" aria-hidden="true"><i class="fas fa-industry"></i></span>
                    <span class="tool-card-body">
                        <span class="tool-card-title">本地离线 ERP</span>
                        <span class="tool-card-description">管理物料、工单和生产流程。</span>
                    </span>
                    <span class="tool-card-arrow" aria-hidden="true"><i class="fas fa-arrow-up-right-from-square"></i></span>
                </a>

                <a class="tool-card" href="/drawio_main">
                    <span class="tool-card-icon" aria-hidden="true"><i class="fas fa-project-diagram"></i></span>
                    <span class="tool-card-body">
                        <span class="tool-card-title">Draw.io 编辑器</span>
                        <span class="tool-card-description">创建流程图、架构图和示意图。</span>
                    </span>
                    <span class="tool-card-arrow" aria-hidden="true"><i class="fas fa-arrow-up-right-from-square"></i></span>
                </a>

                <a class="tool-card" href="/serial_tool">
                    <span class="tool-card-icon" aria-hidden="true"><i class="fas fa-plug"></i></span>
                    <span class="tool-card-body">
                        <span class="tool-card-title">串口调试助手</span>
                        <span class="tool-card-description">连接设备，实时收发并定位问题。</span>
                    </span>
                    <span class="tool-card-arrow" aria-hidden="true"><i class="fas fa-arrow-up-right-from-square"></i></span>
                </a>
            </section>
        </main>

        <footer class="choice-footer">
            <span>Yobboy Server</span>
            <span class="footer-separator" aria-hidden="true">/</span>
            <span>选择入口后即可继续工作</span>
        </footer>
    </div>

    <button type="button" class="hidden-game-entry" id="hiddenGameEntry" title="摸鱼小游戏入口" aria-hidden="true" tabindex="-1">
        <i class="fas fa-gamepad" aria-hidden="true"></i>
        <span>摸鱼入口</span>
    </button>

    <script src="{{ url_for('static', filename='js/choice.js') }}"></script>
</body>

</html>
