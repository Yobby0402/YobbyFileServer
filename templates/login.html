<!DOCTYPE html>
<html>
<head>
    {% include '_theme_bootstrap.html' %}
    <title>登录 - 文件服务器</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <!-- Theme System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app_style.css') }}">
    <style>
        body {
            font-family: "Source Han Sans CN", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--t-bg-body);
            margin: 0;
        }
        .login-card {
            background: var(--t-bg-panel);
            padding: 44px 40px;
            border-radius: 20px;
            box-shadow: var(--t-shadow-lg);
            text-align: center;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--t-border-light);
            backdrop-filter: blur(8px);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.25);
        }
        .login-icon {
            font-size: 48px;
            color: var(--t-primary);
            margin-bottom: 20px;
        }
        h1 {
            color: var(--t-primary-hover);
            margin-bottom: 28px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-label {
            font-weight: 600;
            color: var(--t-text-muted);
            margin-bottom: 6px;
        }
        .form-control {
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 16px;
            background-color: #ffffff !important;
            color: var(--t-text-main) !important;
            border-color: var(--t-border) !important;
        }
        .form-control:focus {
            border-color: var(--t-primary) !important;
            box-shadow: var(--t-focus-ring) !important;
        }
        .btn-primary {
            width: 100%;
            border-radius: 14px;
            padding: 13px 0;
            font-size: 16px;
            font-weight: 600;
        }
        .btn-primary i {
            margin-right: 6px;
        }
        .alert {
            margin-top: 20px;
            border-radius: 8px;
            padding: 12px;
        }
        .alert-danger {
            background-color: rgba(231, 76, 60, 0.1);
            border-color: rgba(231, 76, 60, 0.25);
            color: var(--t-danger);
        }
        @media (max-width: 576px) {
            .login-card {
                padding: 34px 24px;
                margin: 0 15px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-icon">
            <i class="fa fa-folder-open"></i>
        </div>
        <h1>文件服务器 - 登录</h1>
        <form method="post">
            <div class="form-group">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fa fa-sign-in mr-2"></i>登录
            </button>
        </form>
        {% if error %}
            <div class="alert alert-danger">
                <i class="fa fa-exclamation-circle mr-2"></i>{{ error }}
            </div>
        {% endif %}
    </div>
    
    <script src="/static/js/jquery-3.6.0.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme_floater.js') }}"></script>
</body>
</html>
