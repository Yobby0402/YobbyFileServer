<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% include '_theme_bootstrap.html' %}
    <title>登录 - Yobboy 文件服务器</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body data-login-mode="lock">
    <div class="login-app">
        <section class="login-mode login-mode--lock is-active" id="lockMode">
            <div class="lock-stage" id="lockStage" tabindex="0" aria-label="六位密码输入区域">
                <div class="lock-panel">
                    <div class="lock-hero">
                        <span class="login-eyebrow">Yobboy Server</span>
                        <h1>ACCESS GATE</h1>
                        <p class="lock-subtitle">6 位口令输入后仅回显 Yobboy，真实密码不会被直接暴露。</p>
                    </div>

                    <form method="post" id="lockLoginForm" action="{{ url_for('login') }}" novalidate>
                        <input
                            type="password"
                            id="lockPassword"
                            name="password"
                            maxlength="{{ password_length }}"
                            autocomplete="current-password"
                            inputmode="text"
                            class="lock-hidden-input"
                            aria-hidden="true"
                        >
                    </form>

                    <div class="lock-grid" id="lockGrid" aria-hidden="true"></div>

                    <div class="lock-meta">
                        <div class="lock-hint" id="lockHint">INPUT SLOT 01</div>
                        <button type="button" class="mode-link-button" id="lockSwitchToTetris">
                            切换到俄罗斯方块登录
                        </button>
                    </div>

                    <div class="alert alert-danger {% if not error %}d-none{% endif %}" id="lockError" role="alert">
                        <i class="fa fa-exclamation-circle mr-2"></i><span id="lockErrorText">{{ error or '' }}</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="login-mode login-mode--tetris" id="tetrisMode" aria-hidden="true">
            <div class="tetris-shell">
                <section class="tetris-visual-panel">
                    <div class="tetris-stage" id="tetrisStage">
                        <canvas id="tetrisCanvas" aria-hidden="true"></canvas>
                    </div>
                </section>

                <section class="tetris-login-panel">
                    <div class="tetris-login-card">
                        <div class="login-hero">
                            <span class="login-eyebrow">Yobboy Server</span>
                            <h1>俄罗斯方块登录</h1>
                            <p class="lock-subtitle">备用入口，密码规则同样固定为 6 位。</p>
                        </div>

                        <form method="post" id="loginForm" action="{{ url_for('login') }}" novalidate>
                            <div class="form-group">
                                <label for="password" class="form-label">访问密码</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="输入 6 位密码"
                                    maxlength="{{ password_length }}"
                                    autocomplete="current-password"
                                    required
                                >
                            </div>
                            <button type="submit" class="btn btn-primary" id="loginButton">
                                <i class="fa fa-sign-in mr-2"></i>登录
                            </button>
                        </form>

                        <div class="tetris-mode-footer">
                            <button type="button" class="mode-link-button" id="switchToLock">
                                切换回六位锁界面
                            </button>
                        </div>

                        <div class="alert alert-danger {% if not error %}d-none{% endif %}" id="loginError" role="alert">
                            <i class="fa fa-exclamation-circle mr-2"></i><span id="loginErrorText">{{ error or '' }}</span>
                        </div>
                    </div>
                </section>
            </div>
        </section>
    </div>

    <script>
        window.loginUiConfig = {
            loginUrl: "{{ url_for('login') }}",
            redirectUrl: "{{ url_for('index') }}",
            passwordLength: {{ password_length }},
            tetrisFlagKey: "yobboy_tetris_login_mode"
        };
        window.loginTetrisConfig = {
            loginUrl: "{{ url_for('login') }}",
            redirectUrl: "{{ url_for('index') }}",
            passwordMaxLength: {{ password_length }}
        };
    </script>
    <script src="/static/js/jquery-3.6.0.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/vendor/matter.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login_tetris.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login_lock.js') }}"></script>
</body>
</html>
