<!DOCTYPE html>
<html>

<head>
    <title>登录 - 文件服务器</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/jasmine_base.css">
    <style>
        body {
            font-family: "Source Han Sans CN", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--jasmine-gradient-main);
            margin: 0;
        }

        .login-card {
            background: var(--jasmine-panel-gradient);
            padding: 44px 40px;
            border-radius: 20px;
            box-shadow: var(--jasmine-shadow-lg);
            text-align: center;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(95, 191, 174, 0.18);
            backdrop-filter: blur(8px);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 48px rgba(30, 114, 96, 0.22);
        }

        .login-icon {
            font-size: 48px;
            color: var(--jasmine-green-600);
            margin-bottom: 20px;
        }

        h1 {
            color: var(--jasmine-green-700);
            margin-bottom: 28px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            font-weight: 600;
            color: var(--jasmine-muted);
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 16px;
        }

        .btn-primary {
            width: 100%;
            border-radius: 14px;
            padding: 13px 0;
            font-size: 16px;
            font-weight: 600;
        }

        .btn-primary i {
            margin-right: 6px;
        }

        .alert {
            margin-top: 20px;
            border-radius: 8px;
            padding: 12px;
        }

        .alert-danger {
            background-color: rgba(240, 124, 130, 0.1);
            border-color: rgba(240, 124, 130, 0.25);
            color: #b3393f;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 34px 24px;
                margin: 0 15px;
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-icon">
            <i class="fa fa-folder-open"></i>
        </div>
        <h1>文件服务器 - 登录</h1>
        <form method="post">
            <div class="form-group">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fa fa-sign-in mr-2"></i>登录
            </button>
        </form>
        {% if error %}
        <div class="alert alert-danger">
            <i class="fa fa-exclamation-circle mr-2"></i>{{ error }}
        </div>
        {% endif %}
    </div>

    <script src="/static/js/jquery-3.6.0.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/theme.js"></script>
</body>

</html>
