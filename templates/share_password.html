<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问需要密码</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/jasmine_base.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, var(--jasmine-green-600) 0%, var(--jasmine-green-400) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
        }
        .password-container {
            background: var(--jasmine-panel-gradient);
            border-radius: 20px;
            box-shadow: var(--jasmine-shadow-lg);
            padding: 45px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(95, 191, 174, 0.18);
            backdrop-filter: blur(6px);
        }
        .lock-icon {
            font-size: 4.5rem;
            color: #ffc107;
            margin-bottom: 25px;
            display: block;
        }
        .password-container h1 {
            color: #2c3e50;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .password-container > p {
            color: #6c757d;
            font-size: 1rem;
            margin-bottom: 0;
        }
        .password-form {
            margin-top: 35px;
        }
        .password-input {
            margin-bottom: 20px;
        }
        .password-input input {
            padding: 14px 20px;
            font-size: 1.05rem;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            transition: border-color 0.3s ease;
        }
        .password-input input:focus {
            border-color: var(--jasmine-green-600);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-verify {
            width: 100%;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 8px;
        }
        .error-message {
            display: none;
            color: #dc3545;
            margin-top: 20px;
            padding: 14px 18px;
            background: #f8d7da;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
            font-size: 0.95rem;
        }
        .error-message i {
            margin-right: 8px;
        }
        .text-center.mt-4 p {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 25px;
        }
        /* 响应式 */
        @media (max-width: 576px) {
            .password-container {
                padding: 35px 25px;
            }
            .password-container h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="password-container">
        <div class="lock-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1><i class="fas fa-shield-alt"></i> 访问受保护的内容</h1>
        <p class="text-muted">此分享链接需要密码才能访问</p>

        <form class="password-form" id="passwordForm">
            <div class="password-input">
                <input type="password" 
                       class="form-control form-control-lg" 
                       id="password" 
                       placeholder="请输入访问密码" 
                       required 
                       autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-verify">
                <i class="fas fa-key"></i> 验证密码
            </button>
        </form>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
        </div>

        <div class="text-center mt-4">
            <p class="text-muted small">
                <i class="fas fa-info-circle"></i> 
                如果忘记密码，请联系分享者
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            // 禁用按钮，显示加载状态
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 验证中...';
            errorMessage.style.display = 'none';
            
            fetch('/share/{{ share_code }}/verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ password: password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 验证成功，刷新页面
                    window.location.reload();
                } else {
                    // 验证失败，显示错误
                    errorText.textContent = data.message || '密码错误';
                    errorMessage.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-key"></i> 验证密码';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            })
            .catch(error => {
                errorText.textContent = '验证请求失败，请重试';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-key"></i> 验证密码';
            });
        });
    </script>
</body>
</html>
