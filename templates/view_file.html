<!DOCTYPE html>
<html>
<head>
    {% include '_theme_bootstrap.html' %}
    <title>{{ filename }}</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
        <!-- Theme System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app_style.css') }}">
    <!-- 引入本地GitHub风格的Markdown CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/github-markdown-light.min.css') }}">
    <style>
        body { margin: 0; padding: 20px; background: var(--jasmine-gradient-main); color: var(--jasmine-ink); }
        .container { max-width: 1000px; margin: auto; background: rgba(255, 255, 255, 0.92); padding: 28px; border-radius: 18px; box-shadow: var(--jasmine-shadow-lg); border: 1px solid rgba(95, 191, 174, 0.18); backdrop-filter: blur(6px); }
        h1 { color: var(--jasmine-green-700); border-bottom: 1px solid rgba(95, 191, 174, 0.2); padding-bottom: 10px; font-size: 1.2em; }
        .content { margin-top: 20px; }
        .markdown-body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; }
        .markdown-body img { max-width: 100%; height: auto; }
        .image-container { text-align: center; }
        .image-container img { max-width: 100%; height: auto; border: 1px solid rgba(95, 191, 174, 0.2); border-radius: 12px; }
        .pdf-container { text-align: center; width: 100%; height: 90vh; }
        .pdf-container embed { width: 100%; height: 90vh; border: 1px solid rgba(95, 191, 174, 0.2); border-radius: 12px; }
        .back-link { margin-top: 20px; }
        .back-link a { color: var(--jasmine-green-600); text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>正在预览: {{ filename }}</h1>
        <div class="content">
        {% if file_type == 'image' %}
            <div class="image-container">
                <img src="{{ url_for('download_file', filepath=filepath) }}" alt="{{ filename }}">
            </div>
        {% elif file_type == 'markdown' %}
            <article class="markdown-body">
                {{ content|safe }}
            </article>
        {% elif file_type == 'pdf' %}
            <div class="pdf-container">
                <embed src="{{ url_for('download_file', filepath=filepath) }}" type="application/pdf" />
            </div>
        {% else %}
            <p>不支持直接预览此类型的文件。</p>
            <a href="{{ url_for('download_file', filepath=filepath) }}">点击下载</a>
        {% endif %}
        </div>
        <div class="back-link">
            <a href="{{ back_url }}">&larr; 返回上一级</a>
        </div>
    </div>
<script src="{{ url_for('static', filename='js/theme_floater.js') }}"></script>
</body>
</html>
