[DEFAULT]
# 服务器监听地址 / Server listening address
# 0.0.0.0 表示接受所有网络接口的连接 / 0.0.0.0 means accept connections from all network interfaces
# 127.0.0.1 表示仅本地访问 / 127.0.0.1 means local access only
host = 0.0.0.0

# 服务器端口 / Server port
port = 5000

# 文件根目录（必须设置）/ File root directory (must be set)
# Windows 示例 / Windows example: C:\Users\YourName\Documents
# Linux/Mac 示例 / Linux/Mac example: /home/yourname/documents
root_path = 

# 启动时自动打开浏览器 / Auto-open browser on startup
# yes 或 no / yes or no
auto_open_browser = yes

# 文件上传大小限制（MB）/ File upload size limit (MB)
# 默认 100MB / Default 100MB
max_upload_size = 100

# 日志级别 / Log level
# DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO

# 允许的文件扩展名（用逗号分隔）/ Allowed file extensions (comma-separated)
# 留空表示允许所有文件 / Leave empty to allow all files
# allowed_extensions = .txt,.md,.jpg,.png,.drawio

# 禁止的文件扩展名（用逗号分隔）/ Forbidden file extensions (comma-separated)
# 例如：.exe,.bat,.sh / Example: .exe,.bat,.sh
# forbidden_extensions = 

